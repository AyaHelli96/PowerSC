<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-008: Szenario exportieren — CyberSpace NIS2</title>

    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/formular.css">
</head>
<body>

    <div class="formular-container">
        <div class="formular-card">

            <!-- Header (rot = Admin-Bereich) -->
            <div class="formular-card__header">
                <h1 class="formular-card__title">F-008: SZENARIO EXPORTIEREN</h1>
            </div>

            <div class="formular-card__body">

                <div id="alertSuccess" class="alert alert--success" role="alert">
                    Export gestartet! Die JSON-Datei wird heruntergeladen.
                </div>

                <p class="formular-hinweis">
                    Exportiert das gewählte Szenario als JSON-Datei (Metadaten, Karten,
                    Phasen und Rollen) — z.B. für ein Backup.
                </p>

                <form id="exportForm" novalidate>

                    <div class="form-group">
                        <label for="szenario">Szenario *</label>
                        <select id="szenario" name="szenario" class="form-control" required>
                            <option value="">Bitte wählen...</option>
                            <!-- Optionen werden per JavaScript geladen -->
                        </select>
                        <div class="invalid-feedback" id="szenarioError">
                            Bitte wählen Sie ein Szenario.
                        </div>
                    </div>

                    <div class="formular-buttons">
                        <button type="button" class="btn btn--secondary"
                                onclick="window.location.href='admin-dashboard.html'">
                            Abbrechen
                        </button>
                        <button type="submit" class="btn btn--primary" id="submitBtn">
                            📤 Exportieren
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="../js/szenario-export.js"></script>
</body>
</html>
