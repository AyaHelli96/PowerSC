<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSpace NIS2 — Game Over</title>

    <!-- Design System: gemeinsame Variablen, Farben, Buttons -->
    <link rel="stylesheet" href="../css/design-system.css">

    <!-- Game-Over-spezifische Styles -->
    <link rel="stylesheet" href="../css/game-over.css">
</head>
<body>

    <div class="ergebnis-bg ergebnis-bg--gameover">
        <div class="ergebnis-box">

            <!-- Skull-Icon (120pt) -->
            <span class="ergebnis-icon">💀</span>

            <!-- Überschrift -->
            <h1 class="ergebnis-titel">GAME OVER</h1>

            <!-- Finale Punktzahl -->
            <div class="ergebnis-punkte" id="ergebnisPunkte">0/0</div>

            <!-- Compliance-Prozentsatz -->
            <div class="ergebnis-compliance" id="ergebnisCompliance">0% NIS2-Compliance</div>

            <!-- Motivierender Text -->
            <p class="ergebnis-text">Versuch es nochmal! Aus Fehlern lernt man am meisten.</p>

            <!-- Verbesserungshinweis (ST-222) -->
            <div class="verbesserung" id="verbesserung">
                <span class="verbesserung__label">💡 Tipp:</span>
                <span id="verbesserungText">—</span>
            </div>

            <!-- Buttons -->
            <div class="ergebnis-buttons">
                <button class="btn btn--secondary" onclick="zurueck()">
                    ← Zurück zur Auswahl
                </button>
                <button class="btn btn--danger" onclick="nochmal()">
                    🔄 Nochmal versuchen
                </button>
            </div>

        </div>
    </div>

    <script src="../js/game-over.js"></script>
</body>
</html>
