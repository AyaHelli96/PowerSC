<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-010: Neue Session — CyberSpace NIS2</title>

    <!-- Design System: gemeinsame Variablen, Farben, Buttons -->
    <link rel="stylesheet" href="../css/design-system.css">

    <!-- Formular-spezifische Styles -->
    <link rel="stylesheet" href="../css/formular.css">
</head>
<body>

    <div class="formular-container">
        <div class="formular-card">

            <!-- Header (blau = Moderator-Bereich) -->
            <div class="formular-card__header formular-card__header--moderator">
                <h1 class="formular-card__title">F-010: NEUE SESSION ERSTELLEN</h1>
            </div>

            <div class="formular-card__body">

                <!-- Meldungen -->
                <div id="alertSuccess" class="alert alert--success" role="alert">
                    Session wurde erfolgreich erstellt!
                </div>
                <div id="alertError" class="alert alert--danger" role="alert">
                    <span id="alertErrorText">Ein Fehler ist aufgetreten.</span>
                </div>

                <!-- Formular -->
                <form id="neueSessionForm" novalidate>

                    <!-- Session-Name -->
                    <div class="form-group">
                        <label for="sessionName">Session-Name *</label>
                        <input type="text" id="sessionName" name="sessionName"
                               class="form-control"
                               placeholder="z.B. Schulung IT-Team"
                               required
                               maxlength="100">
                        <div class="invalid-feedback" id="nameError">
                            Bitte geben Sie einen Session-Namen ein (max. 100 Zeichen).
                        </div>
                    </div>

                    <!-- Szenario auswählen (nur aktive Szenarien) -->
                    <div class="form-group">
                        <label for="szenario">Szenario *</label>
                        <select id="szenario" name="szenario" class="form-control" required>
                            <option value="">Bitte wählen...</option>
                            <!-- Optionen werden per JavaScript aus den aktiven Szenarien geladen -->
                        </select>
                        <div class="invalid-feedback" id="szenarioError">
                            Bitte wählen Sie ein Szenario.
                        </div>
                    </div>

                    <!-- Zwei Spalten: Max. Spieler + Phasen-Info -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="maxSpieler">Max. Spieler *</label>
                            <input type="number" id="maxSpieler" name="maxSpieler"
                                   class="form-control"
                                   placeholder="z.B. 6"
                                   required
                                   min="2"
                                   max="6"
                                   value="6">
                            <div class="invalid-feedback" id="maxSpielerError">
                                Bitte geben Sie 2–6 Spieler ein.
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="phasenInfo">Phasen</label>
                            <input type="text" id="phasenInfo" name="phasenInfo"
                                   class="form-control"
                                   value="—"
                                   readonly>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="formular-buttons">
                        <button type="button" class="btn btn--secondary"
                                onclick="window.location.href='moderator-dashboard.html'">
                            Abbrechen
                        </button>
                        <button type="submit" class="btn btn--primary" id="submitBtn">
                            Session starten
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Formular-Logik -->
    <script src="../js/session-erstellen.js"></script>
</body>
</html>
