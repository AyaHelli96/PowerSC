version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: cyberspace_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cyberspace123
      MYSQL_DATABASE: cyberspace_nis2
      MYSQL_USER: cyberspace_user
      MYSQL_PASSWORD: cyberspace123
    ports:
      - "3306:3306"
    volumes:
      - "mysql_data:/var/lib/mysql"
      - "./init:/docker-entrypoint-initdb.d"
    networks:
      - cyberspace_network

